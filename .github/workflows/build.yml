name: 编译内核

on:
  push:
    branches:
      - dev/*
      - stable/*
  workflow_dispatch:

env:
  AOSP_TOOLCHAIN_BRANCH: android16
  AOSP_CLANG_VERSION: r547379
  ORIGINAL_BOOT_IMG_URL: https://github.com/Y142857Y/kernel_mi845_lineage/releases/download/none/boot.img
  MAGISK_VERSION: v27.0

jobs:
  build:
    name: 编译内核
    permissions: { contents: write }
    runs-on: ubuntu-26.04
    steps:
      - name: 安装软件包
        if: env.PACKAGES != ''
        env:
          PACKAGES:
            binutils-aarch64-linux-gnu
            binutils-arm-linux-gnueabi
            device-tree-compiler
            cpio
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q ${{ env.PACKAGES }}

      - name: 同步仓库
        uses: actions/checkout@main
        with:
          path: kernel

      - name: 缓存Clang
        id: cache-clang
        uses: actions/cache/restore@main
        with:
          path: clang
          key: clang-${{ env.AOSP_TOOLCHAIN_BRANCH }}-${{ env.AOSP_CLANG_VERSION }}

      - name: 下载Clang
        id: download_clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          wget -c -t 10 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${{ env.AOSP_TOOLCHAIN_BRANCH }}-release/clang-${{ env.AOSP_CLANG_VERSION }}.tar.gz" -O clang.tgz
          tar -zxvf clang.tgz -C clang/

      - name: 保存Clang
        if: always() && steps.cache-clang.outputs.cache-hit != 'true' && steps.download_clang.outcome == 'success'
        uses: actions/cache/save@main
        with:
          path: clang
          key: clang-${{ env.AOSP_TOOLCHAIN_BRANCH }}-${{ env.AOSP_CLANG_VERSION }}

      - name: 缓存ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: kernel-universal-v2-remove-ksu
          restore-keys: kernel-universal-v2-remove-ksu
          max-size: 5G

      - name: 编译
        working-directory: kernel
        env:
          MAKE_ARGS:
            -j$(nproc --all)
            O=out
            LLVM=1
            LLVM_IAS=1
            CC="ccache clang"
            LD=ld.lld
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          CONFIG_FILES:
            vendor/xiaomi/mi845_defconfig
            vendor/xiaomi/mi845_universal.config
            lxc.config
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export KBUILD_BUILD_USER=${{ github.repository_owner }}
          export KBUILD_BUILD_HOST=github-runner
          export KBUILD_BUILD_TIMESTAMP=`date -u -d "@$(git log -1 --format=%at)" +"%a %b %d %H:%M:%S %Z %Y"`

          rm -rf out

          make ${{ env.MAKE_ARGS }} ${{ env.CONFIG_FILES }} all

          mkdir -p dist
          find out/arch/arm64/boot/dts -name "*.dtbo" | \
          xargs python3 scripts/mkdtboimg.py create dist/dtbo.img --page_size=4096

      - name: 验证编译产物无 KSU 残留
        working-directory: kernel
        run: |
          echo "===== Checking Image for KSU symbols ====="
          gunzip -c out/arch/arm64/boot/Image.gz-dtb > /tmp/Image 2>/dev/null || true
          if strings /tmp/Image | grep -iE "ksu_handle|kernelsu_init|kernelsu_"; then
            echo "::error::KSU symbols found in build output, source or cache not cleaned"
            exit 1
          fi
          echo "===== Checking .config for KSU ====="
          if grep -i "CONFIG_KSU" out/.config; then
            echo "::error::CONFIG_KSU still present in out/.config, defconfig not cleaned"
            exit 1
          fi
          echo "===== Validation passed ====="

      - name: 下载 magiskboot
        run: |
          wget -q "https://github.com/topjohnwu/Magisk/releases/download/${{ env.MAGISK_VERSION }}/Magisk-${{ env.MAGISK_VERSION }}.apk" -O magisk.apk
          unzip -o magisk.apk "lib/x86_64/libmagiskboot.so" -d magisk_extract
          mv magisk_extract/lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot
          ./magiskboot --help | head -1

      - name: 打包 boot.img
        working-directory: kernel/dist
        run: |
          wget -q -c "$ORIGINAL_BOOT_IMG_URL" -O original_boot.img
          ls -lh original_boot.img

          $GITHUB_WORKSPACE/magiskboot unpack original_boot.img
          ls -la

          cp ../out/arch/arm64/boot/Image.gz-dtb kernel

          if [ -f ramdisk.cpio ]; then
            echo "===== Checking ramdisk for KSU remnants ====="
            mkdir -p ramdisk_extract
            cd ramdisk_extract
            cpio -idm < ../ramdisk.cpio 2>/dev/null || true

            rm -f init.kernelsu.rc ksud kernelsu* 2>/dev/null || true
            find . -maxdepth 3 \( -iname "*ksu*" -o -iname "*kernelsu*" \) -exec rm -f {} \; 2>/dev/null || true

            for f in init*.rc; do
              if [ -f "$f" ]; then
                sed -i '/kernelsu/d;/KernelSU/d;/ksud/d' "$f"
              fi
            done

            find . | cpio -o -H newc > ../ramdisk.cpio 2>/dev/null
            cd ..
            rm -rf ramdisk_extract
            echo "===== Ramdisk cleanup done ====="
          fi

          $GITHUB_WORKSPACE/magiskboot repack original_boot.img boot.img

          rm -f kernel ramdisk.cpio dtb extra second kernel_dtb header
          ls -lh boot.img

      - name: 上传文件
        uses: actions/upload-artifact@main
        with:
          name: kernel-boot-img
          path: |
            kernel/dist/boot.img
            kernel/dist/dtbo.img
