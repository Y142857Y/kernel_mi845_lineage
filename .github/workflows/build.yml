name: 编译内核

on:
  push:
    branches:
      - dev/*
      - stable/*
      - patch2/*
  workflow_dispatch:

env:
  AOSP_TOOLCHAIN_BRANCH: android16
  AOSP_CLANG_VERSION: r547379
  ORIGINAL_BOOT_IMG_URL: https://github.com/Y142857Y/kernel_mi845_lineage/releases/download/none/boot.img

jobs:
  build:
    name: 编译内核
    permissions: { contents: write }
    runs-on: ubuntu-26.04
    steps:
      - name: 安装软件包
        if: env.PACKAGES != ''
        env:
          PACKAGES:
            binutils-aarch64-linux-gnu
            binutils-arm-linux-gnueabi
            device-tree-compiler
        run: |
          sudo apt-get update  -y -q
          sudo apt-get install -y -q ${{ env.PACKAGES }}

      - name: 同步仓库
        uses: actions/checkout@main
        with:
          path: kernel

      - name: 缓存Clang
        id: cache-clang
        uses: actions/cache/restore@main
        with:
          path: clang
          key: clang-${{ env.AOSP_TOOLCHAIN_BRANCH }}-${{ env.AOSP_CLANG_VERSION }}

      - name: 下载Clang
        id: download_clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          wget -c -t 10 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${{ env.AOSP_TOOLCHAIN_BRANCH }}-release/clang-${{ env.AOSP_CLANG_VERSION }}.tar.gz" -O clang.tgz
          tar -zxvf clang.tgz -C clang/

      - name: 保存Clang
        if: always() && steps.cache-clang.outputs.cache-hit != 'true' && steps.download_clang.outcome == 'success'
        uses: actions/cache/save@main
        with:
          path: clang
          key: clang-${{ env.AOSP_TOOLCHAIN_BRANCH }}-${{ env.AOSP_CLANG_VERSION }}

      - name: 缓存ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: kernel-universal
          restore-keys: kernel-universal
          max-size: 5G

      - name: 编译
        working-directory: kernel
        env:
          MAKE_ARGS:
            -j$(nproc --all)
            O=out
            LLVM=1
            LLVM_IAS=1
            CC="ccache clang"
            LD=ld.lld
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          CONFIG_FILES:
            vendor/xiaomi/mi845_defconfig
            vendor/xiaomi/mi845_universal.config
            lxc.config
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export KBUILD_BUILD_USER=${{ github.repository_owner }}
          export KBUILD_BUILD_HOST=github-runner
          export KBUILD_BUILD_TIMESTAMP="Sat Oct 01 00:00:00 UTC 2026"
          make ${{ env.MAKE_ARGS }} ${{ env.CONFIG_FILES }} all

      - name: 打包完整 boot.img
        working-directory: kernel
        run: |
          sudo apt-get update -y -q && sudo apt-get install -y -q mkbootimg
          mkdir -p prebuilt dist
          wget -q -c "$ORIGINAL_BOOT_IMG_URL" -O prebuilt/original_boot.img
          rm -rf unpacked && mkdir -p unpacked
          unpack_bootimg --boot_img prebuilt/original_boot.img --out "$PWD/unpacked" --format=mkbootimg > unpacked/mkbootimg_args
          NEW_ARGS=$(sed -e "s|--kernel [^ ]*|--kernel $PWD/out/arch/arm64/boot/Image.gz-dtb|" \
                         -e "s|--output [^ ]*||g" \
                         unpacked/mkbootimg_args)
          eval "mkbootimg $NEW_ARGS --output $PWD/dist/boot.img"
          ORIG_SIZE=$(stat -c%s prebuilt/original_boot.img)
          CUR_SIZE=$(stat -c%s dist/boot.img)
          if [ "$CUR_SIZE" -lt "$ORIG_SIZE" ]; then
            truncate -s "$ORIG_SIZE" dist/boot.img
          fi
          ls -lh dist/

      - name: 上传文件
        uses: actions/upload-artifact@main
        with:
          name: kernel-universal-boot
          path: kernel/dist/boot.img
